<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#06b6d4" />
    <meta name="description" content="STINE – Stream, upload and discover African music. DJ tools, live streaming, recording studio." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STINE" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Windows PWA tile -->
    <meta name="msapplication-TileColor" content="#06b6d4" />
    <meta name="msapplication-TileImage" content="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="STINE – African Music Platform" />
    <meta property="og:description" content="Stream, upload and discover African music. DJ tools, live streaming, recording studio." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1514525253440-b39345208668?w=1200&h=630&fit=crop" />

    <title>STINE – African Music Platform</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
